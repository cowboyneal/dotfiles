set -g set-titles on
set -g set-titles-string '#T'
set -g base-index 1

set -g prefix C-a
unbind C-b
bind C-a send-prefix

new
neww

select-window -t 1

set -g pane-border-style "fg=#c0c0c0"
set -g pane-active-border-style "fg=#c0c0c0"
set -g mode-style "fg=#090909,bg=#769ff0,bold"
set -g message-style "fg=#090909,bg=#769ff0,bold"
set -g message-command-style "fg=#a3aed2,bg=#2b324a,bold"

set -g status-style "bg=#1d2230,fg=#a0a9cb"
set -g status-justify left

set -g status-left " "
set -g status-left-length 1

set -g window-status-format "#[fg=#1d2230,bg=#394260]#[bg=#394260,fg=#a3aed2] #I #[fg=#394260,bg=#2b324a]#[fg=#a3aed2,bg=#2b324a] #W#[fg=#2b324a,bg=#1d2230]"
set -g window-status-current-format "#[fg=#1d2230,bg=#a3aed2]#[bg=#a3aed2,fg=#090909,bold] #I #[fg=#a3aed2,bg=#769ff0]#[fg=#090909,bg=#769ff0] #W#[fg=#769ff0,bg=#1d2230]"
set -g window-status-separator ""

set -g status-right "#[fg=#394260,bg=#1d2230]#[bg=#394260,fg=#a0a9cb] #(~/bin/load) "
set -g status-right-length 40
